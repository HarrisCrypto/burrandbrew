name: Delete Porkbun DNS record (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  delete-record:
    runs-on: ubuntu-latest
    env:
      PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
      PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
    steps:
      - name: List records and identify the target
        id: identify
        run: |
          set -euo pipefail
          resp=$(curl -sS -X POST "https://api.porkbun.com/api/json/v3/dns/retrieve/burrandbrew.com" \
            -H "Content-Type: application/json" \
            -d "{\"apikey\":\"$PORKBUN_API_KEY\",\"secretapikey\":\"$PORKBUN_SECRET_KEY\"}")
          echo "$resp" | jq -e '.status == "SUCCESS"' >/dev/null
          echo "Record count: $(echo "$resp" | jq '.records | length')"
          target_count=$(echo "$resp" | jq '[.records[] | select(.type=="A" and .content=="75.2.60.5")] | length')
          echo "Matching A records with content 75.2.60.5: $target_count"
          if [ "$target_count" != "1" ]; then
            echo "ERROR: expected exactly 1 matching record"
            exit 1
          fi
          target_id=$(echo "$resp" | jq -r '.records[] | select(.type=="A" and .content=="75.2.60.5") | .id')
          target_name=$(echo "$resp" | jq -r '.records[] | select(.type=="A" and .content=="75.2.60.5") | .name')
          echo "Target: id=$target_id name=$target_name type=A content=75.2.60.5"
          echo "TARGET_ID=$target_id" >> "$GITHUB_ENV"
      - name: Dry-run the delete
        run: |
          set -euo pipefail
          resp=$(curl -sS -X POST "https://api.porkbun.com/api/json/v3/dns/delete/burrandbrew.com/$TARGET_ID" \
            -H "Content-Type: application/json" \
            -d "{\"apikey\":\"$PORKBUN_API_KEY\",\"secretapikey\":\"$PORKBUN_SECRET_KEY\",\"dryRun\":true}")
          echo "$resp" | jq -e '.wouldSucceed == true' >/dev/null
          echo "Dry run OK: wouldSucceed=true for record id $TARGET_ID"
      - name: Delete the record
        run: |
          set -euo pipefail
          resp=$(curl -sS -X POST "https://api.porkbun.com/api/json/v3/dns/delete/burrandbrew.com/$TARGET_ID" \
            -H "Content-Type: application/json" \
            -d "{\"apikey\":\"$PORKBUN_API_KEY\",\"secretapikey\":\"$PORKBUN_SECRET_KEY\"}")
          echo "$resp" | jq -e '.status == "SUCCESS"' >/dev/null
          echo "Delete response: $(echo "$resp" | jq -c '{status, message}')"
      - name: Verify deletion
        run: |
          set -euo pipefail
          resp=$(curl -sS -X POST "https://api.porkbun.com/api/json/v3/dns/retrieve/burrandbrew.com" \
            -H "Content-Type: application/json" \
            -d "{\"apikey\":\"$PORKBUN_API_KEY\",\"secretapikey\":\"$PORKBUN_SECRET_KEY\"}")
          echo "$resp" | jq -e '.status == "SUCCESS"' >/dev/null
          after_count=$(echo "$resp" | jq '.records | length')
          remaining=$(echo "$resp" | jq '[.records[] | select(.type=="A" and .content=="75.2.60.5")] | length')
          echo "Records after delete: $after_count; A 75.2.60.5 records remaining: $remaining"
          if [ "$remaining" != "0" ]; then echo "ERROR: target record still present"; exit 1; fi
      - name: Revoke the API key
        run: |
          set -euo pipefail
          resp=$(curl -sS -X POST "https://api.porkbun.com/api/json/v3/apikey/revoke" \
            -H "Content-Type: application/json" \
            -d "{\"apikey\":\"$PORKBUN_API_KEY\",\"secretapikey\":\"$PORKBUN_SECRET_KEY\",\"confirm\":\"revoke\"}")
          echo "Revoke response: $(echo "$resp" | jq -c '{status, message}' 2>/dev/null || echo "$resp")"
          echo "$resp" | jq -e '.status == "SUCCESS"' >/dev/null
